<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySQL Data Display</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for Inter font and general body styling */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Light gray background */
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Align to top to prevent table from being too high */
            min-height: 100vh;
            padding: 2rem; /* Add some padding around the content */
            box-sizing: border-box; /* Include padding in element's total width and height */
        }
        .loading-spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left: 4px solid #3b82f6; /* Blue color */
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container mx-auto p-4 bg-white shadow-lg rounded-lg max-w-4xl w-full">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">User Data from MySQL</h1>

        <div id="loadingMessage" class="text-center text-gray-600 mb-4 hidden">
            <div class="loading-spinner"></div>
            <p>Loading data...</p>
        </div>

        <div id="errorMessage" class="text-center text-red-600 mb-4 hidden">
            <p>Error loading data. Please try again later.</p>
        </div>

        <div class="overflow-x-auto rounded-lg border border-gray-200">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider rounded-tl-lg">ID</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider rounded-tr-lg">Role</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody" class="bg-white divide-y divide-gray-200">
                    <!-- Data will be inserted here by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // The URL of your backend API endpoint
        const API_URL = 'http://localhost:3000/api/users';

        // Get elements
        const dataTableBody = document.getElementById('dataTableBody');
        const loadingMessage = document.getElementById('loadingMessage');
        const errorMessage = document.getElementById('errorMessage');

        /**
         * Fetches data from the backend API and populates the table.
         */
        async function fetchAndPopulateTable() {
            loadingMessage.classList.remove('hidden'); // Show loading spinner
            errorMessage.classList.add('hidden');     // Hide error message
            dataTableBody.innerHTML = '';             // Clear existing data

            try {
                const response = await fetch(API_URL); // Make the API call
                if (!response.ok) {
                    // If the HTTP response status is not 2xx, throw an error
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json(); // Parse the JSON response

                // Populate the table with the fetched data
                data.forEach(rowData => {
                    const row = document.createElement('tr');
                    row.classList.add('hover:bg-gray-100'); // Add hover effect to rows

                    const idCell = document.createElement('td');
                    idCell.classList.add('px-6', 'py-4', 'whitespace-nowrap', 'text-sm', 'font-medium', 'text-gray-900');
                    idCell.textContent = rowData.id;
                    row.appendChild(idCell);

                    const nameCell = document.createElement('td');
                    nameCell.classList.add('px-6', 'py-4', 'whitespace-nowrap', 'text-sm', 'text-gray-900');
                    nameCell.textContent = rowData.name;
                    row.appendChild(nameCell);

                    const emailCell = document.createElement('td');
                    emailCell.classList.add('px-6', 'py-4', 'whitespace-nowrap', 'text-sm', 'text-gray-500');
                    emailCell.textContent = rowData.email;
                    row.appendChild(emailCell);

                    const roleCell = document.createElement('td');
                    roleCell.classList.add('px-6', 'py-4', 'whitespace-nowrap', 'text-sm', 'text-gray-500');
                    roleCell.textContent = rowData.role;
                    row.appendChild(roleCell);

                    dataTableBody.appendChild(row);
                });

            } catch (error) {
                console.error('Failed to fetch data:', error);
                errorMessage.classList.remove('hidden'); // Show error message
            } finally {
                loadingMessage.classList.add('hidden'); // Hide loading spinner
            }
        }

        // Call the function to fetch and populate the table when the DOM is fully loaded
        document.addEventListener('DOMContentLoaded', fetchAndPopulateTable);
    </script>
</body>
</html>
